<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교촌에프앤비 상권분석 툴 v2.2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --kyochon-red: #C8202A;
    --kyochon-gold: #B8860B;
    --bg-dark: #1a1a2e;
    --bg-card: #16213e;
    --bg-panel: #0f3460;
    --text-light: #e0e0e0;
    --text-muted: #a0a0b0;
    --border: #2a2a4a;
    --accent: #e94560;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg-dark); color: var(--text-light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  #header {
    background: linear-gradient(135deg, #1a0a0a 0%, #2d0a0a 50%, #1a0a0a 100%);
    border-bottom: 2px solid var(--kyochon-red);
    padding: 10px 20px;
    display: flex; align-items: center; gap: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(200,32,42,0.4);
  }
  #header .logo { font-size: 22px; font-weight: 900; color: var(--kyochon-red); letter-spacing: -0.5px; white-space: nowrap; }
  #header .logo span { color: var(--kyochon-gold); }
  #header .subtitle { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
  .header-badge { background: var(--kyochon-red); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

  /* Search Bar */
  #searchBar {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #searchBar input {
    flex: 1; min-width: 200px;
    background: #0a0a1a; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-light); padding: 8px 14px; font-size: 13px;
    outline: none; transition: border-color 0.2s;
  }
  #searchBar input:focus { border-color: var(--kyochon-red); }
  .btn-primary {
    background: var(--kyochon-red); color: white; border: none;
    padding: 8px 20px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 700; transition: all 0.2s; white-space: nowrap;
  }
  .btn-primary:hover { background: #e0303a; transform: translateY(-1px); }
  .btn-secondary {
    background: transparent; color: var(--text-muted); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    font-size: 12px; transition: all 0.2s; white-space: nowrap;
  }
  .btn-secondary:hover { border-color: var(--kyochon-gold); color: var(--kyochon-gold); }

  /* Radius Slider */
  .radius-wrap { display: flex; align-items: center; gap: 8px; }
  .radius-wrap label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .radius-wrap input[type=range] { width: 100px; accent-color: var(--kyochon-red); }
  #radiusVal { font-size: 12px; color: var(--kyochon-gold); font-weight: 700; white-space: nowrap; }

  /* Brand Filter Chips */
  #brandFilter {
    background: #0d0d1f;
    border-bottom: 1px solid var(--border);
    padding: 7px 16px;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; overflow-x: auto;
  }
  #brandFilter::-webkit-scrollbar { height: 3px; }
  #brandFilter::-webkit-scrollbar-thumb { background: var(--border); }
  .filter-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1.5px solid transparent; transition: all 0.2s; white-space: nowrap;
    user-select: none;
  }
  .chip.active { opacity: 1; }
  .chip:not(.active) { opacity: 0.35; filter: grayscale(0.6); }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  /* Main Layout */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* Map */
  #mapWrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }

  /* Status Bar */
  #statusBar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,26,0.92); border-top: 1px solid var(--border);
    padding: 6px 14px; display: flex; align-items: center; gap: 14px;
    font-size: 11px; flex-wrap: wrap; backdrop-filter: blur(4px);
  }
  .stat-item { display: flex; align-items: center; gap: 5px; }
  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  #statusMsg { color: var(--kyochon-gold); font-size: 11px; margin-left: auto; }

  /* Right Panel */
  #rightPanel {
    width: 320px; background: var(--bg-card); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  }
  .panel-tabs {
    display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; padding: 9px 4px; background: transparent; border: none;
    color: var(--text-muted); font-size: 11px; cursor: pointer; transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--kyochon-red); border-bottom-color: var(--kyochon-red); }
  .tab-content { display: none; flex: 1; overflow-y: auto; padding: 12px; }
  .tab-content.active { display: block; }
  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Score Card */
  .score-card {
    background: linear-gradient(135deg, var(--bg-panel), #1a1040);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 12px;
  }
  .score-title { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .score-main { display: flex; align-items: flex-end; gap: 6px; margin-bottom: 10px; }
  .score-num { font-size: 42px; font-weight: 900; line-height: 1; }
  .score-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .rec-tag-wrap { margin-top: 4px; }
  .rec-tag {
    display: inline-block; padding: 4px 12px; border-radius: 12px;
    font-size: 12px; font-weight: 700;
  }
  .score-bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 10px; color: var(--text-muted); width: 60px; flex-shrink: 0; }
  .bar-bg { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
  .bar-val { font-size: 10px; color: var(--text-light); width: 28px; text-align: right; flex-shrink: 0; }

  /* Competitor List */
  .section-title { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .brand-row {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.04); border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px; border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .brand-row:hover { border-color: var(--border); }
  .brand-info { display: flex; align-items: center; gap: 8px; }
  .brand-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .brand-name { font-size: 12px; font-weight: 600; }
  .brand-cnt { font-size: 11px; color: var(--text-muted); }
  .brand-share { font-size: 11px; color: var(--kyochon-gold); font-weight: 600; }

  /* Log Panel */
  .log-item {
    font-size: 10px; line-height: 1.6; padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-muted);
  }
  .log-item .log-time { color: #444466; margin-right: 6px; }
  .log-item.log-ok .log-msg { color: #4caf50; }
  .log-item.log-warn .log-msg { color: var(--kyochon-gold); }
  .log-item.log-err .log-msg { color: var(--accent); }
  .log-item.log-info .log-msg { color: #64b5f6; }

  /* Chart Panel */
  .chart-wrap { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .chart-title { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
  .chart-warning { font-size: 10px; color: var(--kyochon-gold); margin-top: 6px; display: flex; align-items: center; gap: 4px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #333; color: white; padding: 10px 22px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 9999; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loading Overlay */
  #loadingOverlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10,10,26,0.7); display: none;
    align-items: center; justify-content: center; z-index: 100;
    flex-direction: column; gap: 12px; backdrop-filter: blur(3px);
  }
  #loadingOverlay.show { display: flex; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--kyochon-red); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-muted); }
  .loading-sub { font-size: 11px; color: #555577; }

  /* No API Key Notice */
  #noKeyNotice {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--bg-card); border: 1px solid var(--kyochon-red);
    border-radius: 16px; padding: 30px 36px; text-align: center;
    z-index: 200; display: none; max-width: 360px;
  }
  #noKeyNotice h3 { color: var(--kyochon-red); margin-bottom: 10px; font-size: 16px; }
  #noKeyNotice p { font-size: 12px; color: var(--text-muted); line-height: 1.7; }
  #noKeyNotice input {
    width: 100%; margin-top: 14px; background: #0a0a1a;
    border: 1px solid var(--border); color: white; padding: 9px 12px;
    border-radius: 8px; font-size: 12px; outline: none;
  }
  #noKeyNotice input:focus { border-color: var(--kyochon-red); }

  .empty-state { text-align: center; color: var(--text-muted); font-size: 12px; padding: 30px 0; line-height: 2; }

  @media (max-width: 700px) {
    #rightPanel { width: 100%; height: 240px; border-left: none; border-top: 1px solid var(--border); }
    #main { flex-direction: column; }
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div>
    <div class="logo">교촌<span>에프앤비</span></div>
    <div class="subtitle">상권분석 AI 툴</div>
  </div>
  <div class="header-badge">v2.2 FIXED</div>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <button class="btn-secondary" onclick="exportCSV()">📊 CSV 내보내기</button>
    <button class="btn-secondary" onclick="clearAll()">🗑 초기화</button>
  </div>
</div>

<!-- Search Bar -->
<div id="searchBar">
  <input type="text" id="searchInput" placeholder="분석할 주소 또는 지역명 입력 (예: 서울시 강남구 역삼동)" value="" />
  <button class="btn-primary" onclick="doSearch()">🔍 분석 시작</button>
  <div class="radius-wrap">
    <label>반경</label>
    <input type="range" id="radiusSlider" min="300" max="2000" step="100" value="500" oninput="onRadiusChange(this.value)" />
    <span id="radiusVal">500m</span>
  </div>
</div>

<!-- Brand Filter Chips -->
<div id="brandFilter">
  <span class="filter-label">브랜드 필터:</span>
  <div id="chipContainer"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="mapWrap">
    <div id="map"></div>
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">상권 분석 중...</div>
      <div class="loading-sub" id="loadingSub">잠시만 기다려주세요</div>
    </div>
    <div id="noKeyNotice">
      <h3>🔑 카카오 API 키 필요</h3>
      <p>카카오 개발자센터에서 JavaScript API 키를 발급받아 입력해주세요.<br>maps.kakao.com → 애플리케이션 등록</p>
      <input type="text" id="apiKeyInput" placeholder="JavaScript 앱 키를 입력하세요" />
      <button class="btn-primary" style="width:100%;margin-top:10px" onclick="applyApiKey()">적용하기</button>
    </div>
    <div id="statusBar">
      <div id="legendItems" style="display:flex;gap:12px;flex-wrap:wrap;"></div>
      <span id="statusMsg">지도를 불러오는 중...</span>
    </div>
  </div>

  <!-- Right Panel -->
  <div id="rightPanel">
    <div class="panel-tabs">
      <button class="tab-btn active" onclick="switchTab('score', this)">📈 점수</button>
      <button class="tab-btn" onclick="switchTab('competitors', this)">🏪 경쟁현황</button>
      <button class="tab-btn" onclick="switchTab('chart', this)">📊 차트</button>
      <button class="tab-btn" onclick="switchTab('log', this)">📋 로그</button>
    </div>
    <div id="tab-score" class="tab-content active">
      <div class="empty-state" id="scoreEmpty">
        🔍 분석을 시작하면<br>입지 점수가 표시됩니다
      </div>
      <div id="scoreContent" style="display:none"></div>
    </div>
    <div id="tab-competitors" class="tab-content">
      <div class="empty-state" id="compEmpty">
        🔍 분석 후 경쟁 브랜드<br>현황이 표시됩니다
      </div>
      <div id="compContent" style="display:none"></div>
    </div>
    <div id="tab-chart" class="tab-content">
      <div class="chart-wrap">
        <div class="chart-title">시간대별 유동인구 (샘플 데이터)</div>
        <canvas id="popChart" height="130"></canvas>
        <div class="chart-warning">⚠ 샘플 데이터 — 실제 유동인구와 다를 수 있습니다</div>
      </div>
      <div class="chart-wrap">
        <div class="chart-title" id="brandChartTitle">브랜드별 분포</div>
        <canvas id="brandChart" height="160"></canvas>
      </div>
    </div>
    <div id="tab-log" class="tab-content">
      <div class="section-title">분석 로그</div>
      <div id="logContainer"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* =============================================
   교촌에프앤비 상권분석 툴 v2.2 (버그 수정본)
   Fix list:
   1. recTag outerHTML → innerHTML (래퍼 구조)
   2. otherChicken 검색 로직 재설계 (직접 키워드 검색)
   3. radius 변경 시 debounce 재분석
   4. markerClick → data-id + addEventListener 방식
   5. doSearch() 자동 호출 제거 (기본 주소 설정)
   6. statusMsg null 안전 처리
   7. category_group_code 선택적 사용
============================================= */

// ── 브랜드 데이터 ──────────────────────────────
const BRANDS = [
  { id:'kyochon',    name:'교촌치킨',    kw:'교촌치킨',    color:'#C8202A', textColor:'#fff', isTarget:true  },
  { id:'bbq',        name:'BBQ치킨',     kw:'BBQ치킨',     color:'#FF6B00', textColor:'#fff', isTarget:false },
  { id:'bhc',        name:'BHC치킨',     kw:'bhc치킨',     color:'#FFD700', textColor:'#000', isTarget:false },
  { id:'nene',       name:'네네치킨',    kw:'네네치킨',    color:'#4CAF50', textColor:'#fff', isTarget:false },
  { id:'pelicana',   name:'페리카나',    kw:'페리카나치킨', color:'#2196F3', textColor:'#fff', isTarget:false },
  { id:'godori',     name:'고도리치킨',  kw:'고도리치킨',  color:'#9C27B0', textColor:'#fff', isTarget:false },
  { id:'cheogajip',  name:'처갓집',      kw:'처갓집양념치킨', color:'#FF9800', textColor:'#fff', isTarget:false },
  { id:'twochefs',   name:'두마리치킨',  kw:'두마리치킨',  color:'#795548', textColor:'#fff', isTarget:false },
  { id:'hosigi',     name:'호식이두마리', kw:'호식이두마리치킨', color:'#607D8B', textColor:'#fff', isTarget:false },
  { id:'other',      name:'기타치킨',    kw:null,          color:'#9E9E9E', textColor:'#fff', isTarget:false },
];

// 기타치킨 직접 검색 키워드 목록 (Fix #2)
const OTHER_CHICKEN_KEYWORDS = [
  '땅땅치킨','또봐치킨','또봉이통닭','자담치킨','굽네치킨','60계치킨',
  '노랑통닭','맘스터치','치킨플러스','치킨매니아','달콤치킨','통큰치킨',
  '참치킨','푸라닭','훌랄라','멕시카나치킨','맥시카나','원할머니','치킨왕'
];

// 전체 프랜차이즈 키워드 (기타 필터용)
const ALL_FRANCHISE_KW = BRANDS.filter(b => b.id !== 'other' && b.kw).map(b => b.kw.toLowerCase());

let map, ps, geocoder, circle;
let currentCenter = null;
let radius = 500;
let activeFilters = new Set(BRANDS.map(b => b.id));
let allPlaces = [];   // { brand, place, marker, overlay }
let analysisResult = null;
let radiusDebounceTimer = null;
let popChartInst = null;
let brandChartInst = null;
let KAKAO_KEY = '';

// ── 초기화 ──────────────────────────────────────
window.onload = function() {
  buildChips();
  initPopChart();
  const savedKey = localStorage.getItem('kakao_api_key') || '';
  if (savedKey) {
    KAKAO_KEY = savedKey;
    loadKakaoScript(savedKey);
  } else {
    document.getElementById('noKeyNotice').style.display = 'block';
    setStatus('API 키를 입력해주세요');
  }
};

function applyApiKey() {
  const k = document.getElementById('apiKeyInput').value.trim();
  if (!k) { showToast('API 키를 입력해주세요'); return; }
  KAKAO_KEY = k;
  localStorage.setItem('kakao_api_key', k);
  document.getElementById('noKeyNotice').style.display = 'none';
  loadKakaoScript(k);
}

function loadKakaoScript(key) {
  const s = document.createElement('script');
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&libraries=services&autoload=false`;
  s.onload = () => { kakao.maps.load(initMap); };
  s.onerror = () => {
    document.getElementById('noKeyNotice').style.display = 'block';
    showToast('API 키가 유효하지 않습니다');
    setStatus('API 키 오류');
  };
  document.head.appendChild(s);
}

function initMap() {
  const container = document.getElementById('map');
  const options = { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 5 };
  map = new kakao.maps.Map(container, options);
  ps = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();
  setStatus('지도 준비 완료. 주소를 입력하고 분석을 시작하세요.');
  addLog('카카오맵 API 로드 완료', 'ok');

  // Fix #5: 자동 doSearch() 제거, 기본 주소만 설정
  document.getElementById('searchInput').value = '';
}

// ── 브랜드 칩 ───────────────────────────────────
function buildChips() {
  const container = document.getElementById('chipContainer');
  container.innerHTML = '';
  BRANDS.forEach(b => {
    const chip = document.createElement('span');
    chip.className = 'chip active';
    chip.dataset.brandId = b.id;
    chip.style.background = b.color + '22';
    chip.style.borderColor = b.color;
    chip.style.color = b.color;
    chip.innerHTML = `<span class="chip-dot" style="background:${b.color}"></span>${b.name}`;
    chip.addEventListener('click', () => toggleFilter(b.id, chip));
    container.appendChild(chip);
  });
}

function toggleFilter(id, el) {
  if (activeFilters.has(id)) {
    activeFilters.delete(id);
    el.classList.remove('active');
  } else {
    activeFilters.add(id);
    el.classList.add('active');
  }
  refreshMarkers();
}

// ── 검색 시작 ────────────────────────────────────
function doSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { showToast('분석할 주소나 지역명을 입력해주세요'); return; }
  if (!map) { showToast('지도를 불러오는 중입니다. 잠시 후 다시 시도해주세요.'); return; }
  clearAll(false);
  showLoading('주소 검색 중...', query);
  addLog(`검색 시작: "${query}"`, 'info');

  geocoder.addressSearch(query, (res, status) => {
    if (status === kakao.maps.services.Status.OK) {
      const coord = new kakao.maps.LatLng(res[0].y, res[0].x);
      startAnalysis(coord);
    } else {
      ps.keywordSearch(query, (res, status) => {
        if (status === kakao.maps.services.Status.OK) {
          const coord = new kakao.maps.LatLng(res[0].y, res[0].x);
          startAnalysis(coord);
        } else {
          hideLoading();
          showToast('주소를 찾을 수 없습니다. 다시 확인해주세요.');
          addLog(`주소 검색 실패: "${query}"`, 'err');
          setStatus('주소 검색 실패');
        }
      });
    }
  });
}

function startAnalysis(coord) {
  currentCenter = coord;
  map.setCenter(coord);
  map.setLevel(4);
  drawCircle(coord);
  placeTargetMarker(coord);
  setStatus('상권 분석 중...');
  addLog(`분석 좌표: ${coord.getLat().toFixed(5)}, ${coord.getLng().toFixed(5)}`, 'info');
  buildSearchQueue(coord);
}

// ── 원형 반경 그리기 ────────────────────────────
function drawCircle(coord) {
  if (circle) circle.setMap(null);
  circle = new kakao.maps.Circle({
    center: coord, radius: radius,
    strokeWeight: 2, strokeColor: '#C8202A', strokeOpacity: 0.8,
    strokeStyle: 'solid', fillColor: '#C8202A', fillOpacity: 0.06
  });
  circle.setMap(map);
}

// 분석 중심 마커
function placeTargetMarker(coord) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="38" viewBox="0 0 32 38">
    <path d="M16 0C7.16 0 0 7.16 0 16c0 11 16 22 16 22S32 27 32 16C32 7.16 24.84 0 16 0z" fill="#C8202A"/>
    <circle cx="16" cy="16" r="7" fill="white"/>
    <circle cx="16" cy="16" r="4" fill="#C8202A"/>
  </svg>`;
  const markerImage = new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg))),
    new kakao.maps.Size(32, 38),
    { offset: new kakao.maps.Point(16, 38) }
  );
  new kakao.maps.Marker({ position: coord, map: map, image: markerImage, zIndex: 10 });
}

// ── 검색 큐 ─────────────────────────────────────
let searchQueue = [];
let searchTimer = null;

function buildSearchQueue(coord) {
  searchQueue = [];

  // Top 브랜드 검색 (교촌~호식이)
  BRANDS.filter(b => b.id !== 'other' && b.kw).forEach(b => {
    searchQueue.push({ type: 'brand', brand: b, coord });
  });

  // Fix #2: 기타치킨 — OTHER_CHICKEN_KEYWORDS로 직접 검색
  OTHER_CHICKEN_KEYWORDS.forEach(kw => {
    searchQueue.push({ type: 'other', kw, coord });
  });

  updateLoadingSub(`0 / ${searchQueue.length} 브랜드 검색`);
  processQueue(0);
}

function processQueue(idx) {
  if (idx >= searchQueue.length) {
    finishAnalysis();
    return;
  }
  const item = searchQueue[idx];
  const done = idx;
  const total = searchQueue.length;
  updateLoadingSub(`${done} / ${total} 검색 완료`);

  if (item.type === 'brand') {
    searchBrand(item.brand, item.coord, () => {
      setTimeout(() => processQueue(idx + 1), 260);
    });
  } else {
    searchOtherKeyword(item.kw, item.coord, () => {
      setTimeout(() => processQueue(idx + 1), 260);
    });
  }
}

// ── 브랜드 검색 ─────────────────────────────────
const seenPlaces = new Set();

function searchBrand(brand, coord, cb) {
  ps.keywordSearch(brand.kw, (res, status) => {
    if (status === kakao.maps.services.Status.OK) {
      let cnt = 0;
      res.forEach(place => {
        const uid = place.id || (place.place_name + '_' + place.x + '_' + place.y);
        if (seenPlaces.has(uid)) return;
        const dist = getDistanceFromCenter(coord, place);
        if (dist > radius) return;
        seenPlaces.add(uid);
        addPlaceMarker(brand, place, dist);
        cnt++;
      });
      addLog(`${brand.name}: ${cnt}개 발견`, cnt > 0 ? 'ok' : 'warn');
    } else {
      addLog(`${brand.name}: 검색 결과 없음`, 'warn');
    }
    cb();
  }, {
    location: coord,
    radius: radius,
    size: 15
    // Fix #7: category_group_code 제거하여 누락 방지
  });
}

function searchOtherKeyword(kw, coord, cb) {
  ps.keywordSearch(kw, (res, status) => {
    if (status === kakao.maps.services.Status.OK) {
      res.forEach(place => {
        const uid = place.id || (place.place_name + '_' + place.x + '_' + place.y);
        if (seenPlaces.has(uid)) return;
        const dist = getDistanceFromCenter(coord, place);
        if (dist > radius) return;
        // 이미 알려진 TOP 브랜드면 제외
        const pnameLow = place.place_name.toLowerCase();
        const isKnown = ALL_FRANCHISE_KW.some(fk => pnameLow.includes(fk));
        if (isKnown) return;
        seenPlaces.add(uid);
        const otherBrand = BRANDS.find(b => b.id === 'other');
        addPlaceMarker(otherBrand, place, dist);
      });
    }
    cb();
  }, {
    location: coord,
    radius: radius,
    size: 15
  });
}

// ── 마커 추가 ────────────────────────────────────
function addPlaceMarker(brand, place, dist) {
  const pos = new kakao.maps.LatLng(place.y, place.x);
  const isTarget = brand.isTarget;

  // SVG 마커
  const sz = isTarget ? 28 : 22;
  const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="${sz}" height="${sz+6}" viewBox="0 0 28 34">
    <path d="M14 0C6.27 0 0 6.27 0 14c0 9.63 14 20 14 20S28 23.63 28 14C28 6.27 21.73 0 14 0z" fill="${brand.color}"/>
    <circle cx="14" cy="14" r="7" fill="white" opacity="0.9"/>
    <text x="14" y="18" text-anchor="middle" font-size="9" font-weight="bold" fill="${brand.color}">${brand.name.charAt(0)}</text>
  </svg>`;
  const markerImg = new kakao.maps.MarkerImage(
    'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr))),
    new kakao.maps.Size(sz, sz + 6),
    { offset: new kakao.maps.Point(sz / 2, sz + 6) }
  );
  const marker = new kakao.maps.Marker({ position: pos, map: map, image: markerImg, zIndex: isTarget ? 5 : 3 });

  // 오버레이
  const overlayContent = document.createElement('div');
  overlayContent.style.cssText = `background:${brand.color};color:white;padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.4);cursor:pointer;`;
  overlayContent.innerHTML = `${brand.name}<br><span style="font-weight:400;font-size:10px;">${place.place_name} · ${Math.round(dist)}m</span>`;

  const overlay = new kakao.maps.CustomOverlay({
    content: overlayContent, position: pos, yAnchor: 2.2, zIndex: 10
  });

  // Fix #4: data-id + addEventListener 방식
  const placeObj = { brand, place, marker, overlay, dist, visible: true };
  const placeIdx = allPlaces.length;
  allPlaces.push(placeObj);

  overlayContent.addEventListener('click', () => {
    markerClick(placeIdx);
  });

  // Fix #4: marker click → addEventListener
  kakao.maps.event.addListener(marker, 'click', () => {
    markerClick(placeIdx);
  });

  kakao.maps.event.addListener(marker, 'mouseover', () => overlay.setMap(map));
  kakao.maps.event.addListener(marker, 'mouseout', () => overlay.setMap(null));
}

function markerClick(idx) {
  const item = allPlaces[idx];
  if (!item) return;
  const { brand, place, dist } = item;
  showToast(`${brand.name} · ${place.place_name} (${Math.round(dist)}m)`);
  addLog(`선택: ${place.place_name} [${brand.name}] ${Math.round(dist)}m`, 'info');
}

// ── 거리 계산 ────────────────────────────────────
function getDistanceFromCenter(center, place) {
  const R = 6371000;
  const lat1 = center.getLat() * Math.PI / 180;
  const lat2 = parseFloat(place.y) * Math.PI / 180;
  const dLat = (parseFloat(place.y) - center.getLat()) * Math.PI / 180;
  const dLng = (parseFloat(place.x) - center.getLng()) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── 분석 완료 ────────────────────────────────────
function finishAnalysis() {
  hideLoading();
  updateLegend();
  analysisResult = computeScore();
  renderScorePanel(analysisResult);
  renderCompPanel();
  updateBrandChart();
  addLog(`분석 완료: 총 ${allPlaces.length}개 매장 발견`, 'ok');
  setStatus(`분석 완료 — ${allPlaces.length}개 매장 | 반경 ${radius}m`);
  showToast(`분석 완료! 총 ${allPlaces.length}개 치킨 매장 발견`);
}

// ── 점수 계산 ────────────────────────────────────
function computeScore() {
  const total = allPlaces.length;
  const kyochonCnt = allPlaces.filter(p => p.brand.id === 'kyochon').length;
  const compCnt = total - kyochonCnt;

  // 경쟁 밀도 점수 (경쟁자 적을수록 높음)
  const compDensity = Math.max(0, 100 - compCnt * 8);
  // 자사 존재 여부
  const selfScore = kyochonCnt === 0 ? 100 : Math.max(20, 100 - kyochonCnt * 25);
  // 유동인구 추정 (반경 기반 샘플)
  const popScore = Math.min(100, 40 + radius / 30);
  // 임대료 추정 역산
  const rentScore = Math.max(30, 90 - radius / 40);
  // 종합
  const total_score = Math.round(compDensity * 0.35 + selfScore * 0.3 + popScore * 0.2 + rentScore * 0.15);

  let recLabel, recColor, recBg;
  if (total_score >= 80) { recLabel = '강력 추천 ✅'; recColor = '#4caf50'; recBg = 'rgba(76,175,80,0.15)'; }
  else if (total_score >= 60) { recLabel = '검토 가능 ⚠️'; recColor = '#FF9800'; recBg = 'rgba(255,152,0,0.15)'; }
  else { recLabel = '진입 주의 ❌'; recColor = '#f44336'; recBg = 'rgba(244,67,54,0.15)'; }

  return { total_score, compDensity, selfScore, popScore, rentScore, recLabel, recColor, recBg, kyochonCnt, compCnt, total };
}

// ── 점수 패널 렌더링 ─────────────────────────────
function renderScorePanel(r) {
  document.getElementById('scoreEmpty').style.display = 'none';
  const el = document.getElementById('scoreContent');
  el.style.display = 'block';

  const scoreColor = r.total_score >= 80 ? '#4caf50' : r.total_score >= 60 ? '#FF9800' : '#f44336';

  el.innerHTML = `
    <div class="score-card">
      <div class="score-title">입지 종합 점수</div>
      <div class="score-main">
        <div class="score-num" style="color:${scoreColor}">${r.total_score}</div>
        <div class="score-sub">/ 100점<br><span style="font-size:10px;color:#666">반경 ${radius}m 기준</span></div>
      </div>
      <div class="rec-tag-wrap">
        <div id="recTagWrap">
          <span id="recTagInner" class="rec-tag" style="background:${r.recBg};color:${r.recColor};border:1px solid ${r.recColor}40;">${r.recLabel}</span>
        </div>
      </div>
    </div>
    <div class="score-card">
      <div class="score-title">세부 점수</div>
      <div class="score-bars">
        ${scoreBar('경쟁 밀도', r.compDensity, '#4CAF50')}
        ${scoreBar('자사 포화도', r.selfScore, '#2196F3')}
        ${scoreBar('유동인구 추정', r.popScore, '#FF9800')}
        ${scoreBar('임대료 추정', r.rentScore, '#9C27B0')}
      </div>
    </div>
    <div class="score-card" style="font-size:11px;line-height:1.8;color:var(--text-muted)">
      <div class="score-title">요약</div>
      반경 내 교촌치킨 <b style="color:#C8202A">${r.kyochonCnt}개</b> · 경쟁사 <b style="color:#FF9800">${r.compCnt}개</b><br>
      총 치킨 매장 <b style="color:white">${r.total}개</b> 분석 완료
    </div>`;
}

// Fix #1: recTag innerHTML 방식 (재참조 가능)
function updateRecTag(recLabel, recColor, recBg) {
  const wrap = document.getElementById('recTagWrap');
  if (!wrap) return;
  wrap.innerHTML = `<span class="rec-tag" style="background:${recBg};color:${recColor};border:1px solid ${recColor}40;">${recLabel}</span>`;
}

function scoreBar(label, val, color) {
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-bg"><div class="bar-fill" style="width:${val}%;background:${color}"></div></div>
    <div class="bar-val">${val}</div>
  </div>`;
}

// ── 경쟁 현황 패널 ───────────────────────────────
function renderCompPanel() {
  document.getElementById('compEmpty').style.display = 'none';
  const el = document.getElementById('compContent');
  el.style.display = 'block';

  const counts = {};
  BRANDS.forEach(b => counts[b.id] = 0);
  allPlaces.forEach(p => { if (counts[p.brand.id] !== undefined) counts[p.brand.id]++; });
  const total = allPlaces.length || 1;

  let html = `<div class="section-title">브랜드별 매장 수 (반경 ${radius}m)</div>`;
  BRANDS.slice().sort((a,b) => counts[b.id] - counts[a.id]).forEach(brand => {
    const cnt = counts[brand.id];
    const share = ((cnt / total) * 100).toFixed(1);
    html += `<div class="brand-row">
      <div class="brand-info">
        <div class="brand-color" style="background:${brand.color}"></div>
        <div>
          <div class="brand-name">${brand.name}</div>
          <div class="brand-cnt">${cnt}개 매장</div>
        </div>
      </div>
      <div class="brand-share">${share}%</div>
    </div>`;
  });
  el.innerHTML = html;
}

// ── 범례 업데이트 ────────────────────────────────
function updateLegend() {
  const leg = document.getElementById('legendItems');
  const counts = {};
  BRANDS.forEach(b => counts[b.id] = 0);
  allPlaces.forEach(p => { if (counts[p.brand.id] !== undefined) counts[p.brand.id]++; });

  leg.innerHTML = BRANDS.map(b => {
    if (!counts[b.id]) return '';
    return `<div class="stat-item">
      <div class="stat-dot" style="background:${b.color}"></div>
      <span style="font-size:11px;color:${b.color};font-weight:600">${b.name}</span>
      <span style="font-size:11px;color:#666">${counts[b.id]}</span>
    </div>`;
  }).join('');
}

// Fix #8: statusMsg null 안전 처리
function setStatus(msg) {
  const e = document.getElementById('statusMsg');
  if (e) e.textContent = msg;
}

// ── 마커 표시/숨김 ───────────────────────────────
function refreshMarkers() {
  allPlaces.forEach(item => {
    const show = activeFilters.has(item.brand.id);
    item.marker.setMap(show ? map : null);
    item.visible = show;
  });
}

// ── 반경 변경 (Fix #3: debounce 재분석) ─────────
function onRadiusChange(v) {
  radius = parseInt(v);
  document.getElementById('radiusVal').textContent = radius + 'm';
  if (circle && currentCenter) circle.setRadius(radius);

  clearTimeout(radiusDebounceTimer);
  radiusDebounceTimer = setTimeout(() => {
    if (currentCenter) {
      addLog(`반경 변경: ${radius}m → 재분석`, 'info');
      clearAll(false);
      startAnalysis(currentCenter);
    }
  }, 600);
}

// ── 초기화 ───────────────────────────────────────
function clearAll(resetInput = true) {
  allPlaces.forEach(item => { item.marker.setMap(null); item.overlay.setMap(null); });
  allPlaces = [];
  seenPlaces.clear && seenPlaces.clear();
  // seenPlaces는 Set이므로 재생성
  seenPlaces2 = seenPlaces;
  if (circle) { circle.setMap(null); circle = null; }
  if (resetInput) { document.getElementById('searchInput').value = ''; currentCenter = null; }
  document.getElementById('legendItems').innerHTML = '';
  document.getElementById('scoreEmpty').style.display = 'block';
  document.getElementById('scoreContent').style.display = 'none';
  document.getElementById('compEmpty').style.display = 'block';
  document.getElementById('compContent').style.display = 'none';
  analysisResult = null;
  setStatus('초기화 완료');
}

// ── 차트 ─────────────────────────────────────────
function initPopChart() {

  popChartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels: hours,
      datasets: [{
        label: '유동인구(샘플)',
        data: popData,
        borderColor: '#C8202A',
        backgroundColor: 'rgba(200,32,42,0.12)',

      }]
    },

      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },

        x: { ticks: { color: '#666', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } },

function updateBrandChart() {
  const ctx = document.getElementById('brandChart').getContext('2d');
  const counts = {};
  BRANDS.forEach(b => counts[b.id] = 0);
  allPlaces.forEach(p => { if (counts[p.brand.id] !== undefined) counts[p.brand.id]++; });

  const labels = BRANDS.filter(b => counts[b.id] > 0).map(b => b.name);
  const data = BRANDS.filter(b => counts[b.id] > 0).map(b => counts[b.id]);
  const colors = BRANDS.filter(b => counts[b.id] > 0).map(b => b.color);

  if (brandChartInst) brandChartInst.destroy();
  brandChartInst = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 1, borderColor: '#1a1a2e' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { color: '#aaa', font: { size: 10 }, boxWidth: 12, padding: 8 } } }
    }
  });
  document.getElementById('brandChartTitle').textContent = `브랜드별 분포 (총 ${allPlaces.length}개)`;
}

// ── CSV 내보내기 ─────────────────────────────────
function exportCSV() {
  if (!allPlaces.length) { showToast('분석 데이터가 없습니다'); return; }
  const BOM = '\uFEFF';
  const header = '브랜드,매장명,주소,전화번호,거리(m)\n';
  const rows = allPlaces.map(p => {
    const pl = p.place;
    return [p.brand.name, pl.place_name, pl.road_address_name || pl.address_name, pl.phone || '', Math.round(p.dist)].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  }).join('\n');
  const blob = new Blob([BOM + header + rows], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `교촌상권분석_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  addLog('CSV 내보내기 완료', 'ok');
}

// ── 탭 전환 ─────────────────────────────────────
function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── 로그 ─────────────────────────────────────────
function addLog(msg, type = 'info') {
  const container = document.getElementById('logContainer');
  const now = new Date(); const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  const div = document.createElement('div');
  div.className = `log-item log-${type}`;
  div.innerHTML = `<span class="log-time">[${ts}]</span><span class="log-msg">${msg}</span>`;
  container.insertBefore(div, container.firstChild);
  if (container.children.length > 25) container.removeChild(container.lastChild);
}

// ── Loading / Toast ──────────────────────────────
function showLoading(text, sub) {
  document.getElementById('loadingText').textContent = text || '분석 중...';
  document.getElementById('loadingSub').textContent = sub || '';
  document.getElementById('loadingOverlay').classList.add('show');
}
function updateLoadingSub(sub) {
  document.getElementById('loadingSub').textContent = sub;
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('show');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Enter 키 검색 ────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
